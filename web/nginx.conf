# index.html sempre revalidado (um deploy chega na próxima visita); os assets com hash do Vite
# nunca mudam sob o mesmo nome e ficam um ano em cache.
server {
    listen       8080;
    server_name  localhost;
    root         /usr/share/nginx/html;

    location / {
        index  index.html;
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Sem `always`: só o que existe fica em cache — um 404 no meio de um deploy não pode durar um ano.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
